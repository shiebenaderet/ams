<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer 2026 Current Events Showdown</title><style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap');
:root{--navy:#1B2D45;--gold:#B8893B;--warm:#C75B2A;--sage:#4A6741;--purple:#6B4C8A;--bg:#F5F0E8;--card:#FEFCF8;--ink:#1A1A1A;--muted:#5C564E;--border:#D6CFC3;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);}
header h1{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--navy);flex:1;}
.prog{font-size:.85rem;color:var(--muted);font-weight:600;}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;}
button{font-family:'Outfit';font-weight:700;border:none;border-radius:26px;padding:.7rem 1.6rem;font-size:1rem;cursor:pointer;background:var(--navy);color:#fff;}
button.warm{background:var(--warm);}
button.ghost{background:var(--card);color:var(--navy);border:1px solid var(--border);}
.controls{display:flex;gap:10px;padding:16px;justify-content:center;}

.cat{display:inline-block;color:#fff;font-weight:700;font-size:.8rem;letter-spacing:.06em;padding:.3rem 1rem;border-radius:20px;margin-bottom:14px;}
.q{font-family:'Fraunces',serif;font-size:2rem;color:var(--navy);max-width:1000px;text-align:center;margin-bottom:26px;}
.opts{display:flex;flex-direction:column;gap:12px;width:min(860px,94vw);}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:14px 18px;font-size:1.2rem;transition:.25s;}
.opt .ltr{width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;flex-shrink:0;}
.revealed .opt.correct{border-color:var(--sage);background:#EEF3EC;box-shadow:0 0 0 3px var(--sage);}
.revealed .opt:not(.correct){opacity:.45;}
.fact{margin-top:20px;font-size:1.05rem;color:var(--ink);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;max-width:860px;opacity:0;transition:.3s;}
.revealed .fact{opacity:1;}
#fin{display:none;text-align:center;}
#fin h2{font-family:'Fraunces',serif;font-size:3rem;color:var(--navy);margin-bottom:14px;}
#fin p{color:var(--muted);max-width:700px;}
</style></head><body>
<header><h1>Summer 2026 Current Events Showdown</h1><span class="prog" id="prog"></span></header>
<main id="stage">
  <span class="cat" id="cat"></span>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <div class="fact" id="fact"></div>
</main>
<main id="fin"><h2>Final scores! 🏁</h2><p><b>Tiebreaker:</b> closest guess wins — how many fans attended the World Cup final at MetLife Stadium? <span id="tb" style="color:var(--bg)">(82,000+)</span> <button class="ghost" style="padding:.2rem .8rem;font-size:.8rem" onclick="document.getElementById('tb').style.color='var(--sage)'">reveal</button></p></main>
<div class="controls">
  <button class="ghost" onclick="prev()">&larr; Back</button>
  <button class="warm" id="mainbtn" onclick="advance()">Reveal answer</button>
</div>
<script>
const QS = [["AMERICA", "On July 4, 2026, the United States celebrated a very big birthday. Which one?", ["200th", "225th", "250th"], 2, "The Declaration of Independence was adopted July 4, 1776 \u2014 this summer was the nation's 250th, the 'semiquincentennial.' We'll spend all year with the people who started that story."], ["AMERICA", "The 250th birthday even has an official tongue-twister name. What is it?", ["The Sestercentennial", "The Semiquincentennial", "The Quarter-Millennium Jubilee"], 1, "Semiquincentennial \u2014 try saying it five times fast. You'll also see it branded as 'America250.'"], ["SPORTS", "A gigantic sports tournament was played across the U.S., Canada, and Mexico this summer. What was it?", ["The Olympics", "The FIFA World Cup", "The Rugby World Cup"], 1, "The 2026 FIFA World Cup \u2014 the first ever hosted by three countries, with matches in Seattle among the host cities."], ["SPORTS", "How many national teams played in this World Cup \u2014 the biggest ever?", ["32", "40", "48"], 2, "48 teams, expanded from 32 \u2014 more countries than ever got their shot."], ["SPORTS", "Who won the World Cup final on July 19?", ["Argentina", "Spain", "Brazil"], 1, "Spain beat Argentina 1\u20130 in a grinder of a final."], ["SPORTS", "Where was that World Cup final played?", ["MetLife Stadium, New Jersey", "SoFi Stadium, Los Angeles", "Estadio Azteca, Mexico City"], 0, "MetLife Stadium just outside New York City \u2014 over 80,000 fans."], ["SPORTS", "Which NBA team won the 2026 championship \u2014 their first title since 1973?", ["San Antonio Spurs", "New York Knicks", "Oklahoma City Thunder"], 1, "The Knicks ended a 53-year drought, beating the Spurs in five games."], ["SPORTS", "Who took home Finals MVP for the Knicks?", ["Jalen Brunson", "Karl-Anthony Towns", "Josh Hart"], 0, "Jalen Brunson won the Bill Russell Trophy."], ["MOVIES", "Christopher Nolan's big July movie is based on an ancient Greek epic poem. Which one?", ["The Iliad", "The Odyssey", "The Aeneid"], 1, "The Odyssey, with Matt Damon and Tom Holland \u2014 a 2,700-year-old story still selling out theaters. Old stories have power; that's kind of our whole class."], ["MOVIES", "Which DC superhero got their own movie this summer?", ["Supergirl", "Batgirl", "Green Lantern"], 0, "Supergirl hit theaters as one of summer 2026's biggest releases."], ["MUSIC", "Song-of-the-summer contender 'I Knew It, I Knew You' is by which artist?", ["Olivia Rodrigo", "Taylor Swift", "Ariana Grande"], 1, "Taylor Swift \u2014 one of Forbes' picks for song of the summer."], ["MUSIC", "Olivia Rodrigo's summer hit has a very honest title. What is it actually called?", ["'stupid song'", "'bad idea'", "'whatever'"], 0, "It's literally titled 'stupid song' \u2014 and it was everywhere."], ["MUSIC", "Which K-pop superstars came back this summer with the single 'SWIM'?", ["Stray Kids", "BTS", "SEVENTEEN"], 1, "BTS \u2014 back together and straight onto the song-of-summer lists."], ["HISTORY?", "Time-travel check: which of these did NOT exist in summer 1776?", ["Newspapers", "The word 'teenager'", "Fireworks"], 1, "'Teenager' wasn't coined until the 1940s. Newspapers and fireworks were both around \u2014 Adams even predicted Americans would celebrate independence with 'illuminations.'"], ["YOUR TURN", "Final question \u2014 no points: what was YOUR headline of the summer?", ["Round robin at your table", "Say your NAME first", "Pick your table's best to share"], -1, "30 seconds each. Names first, then your personal headline of summer 2026."]], CATC = {"AMERICA": "#C75B2A", "SPORTS": "#4A6741", "MOVIES": "#6B4C8A", "MUSIC": "#B8893B", "HISTORY?": "#1B2D45", "YOUR TURN": "#C75B2A"};
let i=0, revealed=false;
const $=id=>document.getElementById(id);
function draw(){
  $('stage').style.display='flex';$('fin').style.display='none';
  const [cat,q,opts,ans,fact]=QS[i];
  $('cat').textContent=cat;$('cat').style.background=CATC[cat];
  $('q').textContent=q;$('fact').textContent=fact;
  $('opts').innerHTML=opts.map((o,j)=>`<div class="opt${j===ans?' correct':''}"><span class="ltr" style="background:${CATC[cat]}">${'ABC'[j]||'•'}</span>${o}</div>`).join('');
  document.body.classList.toggle('revealed', revealed && ans>=0);
  if(ans<0) $('fact').style.opacity=1;
  $('prog').textContent='Q'+(i+1)+' of '+QS.length;
  $('mainbtn').textContent = (revealed||ans<0) ? (i===QS.length-1?'Finish':'Next question →') : 'Reveal answer';
}
function advance(){
  const ans=QS[i][3];
  if(!revealed && ans>=0){revealed=true;draw();return;}
  if(i===QS.length-1){$('stage').style.display='none';$('fin').style.display='flex';$('mainbtn').textContent='Play again';i=-1;revealed=false;$('prog').textContent='';return;}
  i++;revealed=false;draw();
}
function prev(){ if(revealed){revealed=false;draw();} else if(i>0){i--;revealed=true;draw();} }
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();advance();}if(e.key==='ArrowLeft'){prev();}});
draw();
</script></body></html>

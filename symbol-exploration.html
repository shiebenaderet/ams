<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symbol Exploration - Mr. B's Social Studies</title>
<meta name="description" content="Explore sixteen symbols of America across four categories, and decide for yourselves which ones say what it means to be American. Unit 1: Foundations &amp; Identity.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;display=swap">
<style>
/* ---------------------------------------------------------------------------
   Symbol Exploration -- a standalone student activity.

   This page deliberately does not load the site's style.css. It is not a page
   of the website; it is the thing students spend a lesson inside, and it reads
   better owning its own palette and type than wearing the site's chrome.

   Audience is a 13-year-old on a shared school laptop, mid-class, with a paper
   handout next to the keyboard. That sets the rules: big targets, one obvious
   action per screen, nothing important hidden behind hover, and no step that
   has to be explained before they can start.

   Type: Atkinson Hyperlegible Next for everything that gets read -- it was
   drawn by the Braille Institute to keep letterforms apart for low-vision
   readers, which is the right default for a class with many students reading
   well below grade level. Bricolage Grotesque carries the display sizes, where
   character matters more than legibility at small sizes.

   Radii run on a deliberate three-step scale rather than one value everywhere
   (pill for buttons, card for panels, chip for small inline things) -- one
   radius reused everywhere is the tell that nobody chose it.
--------------------------------------------------------------------------- */
:root {
  /* Warm paper, warmer and lighter than the main site's cream, so the two do
     not read as the same surface. No grey anywhere: the muted tone is a warm
     brown-grey, not a neutral one. */
  --color-bg: #FDF6EC;
  --color-card-bg: #FFFFFF;
  --color-text: #2A2119;
  --color-primary: #241C15;
  --color-muted: #6B6058;
  --color-border: #E7DAC7;
  --color-accent: #E0A32E;
  --color-accent-warm: #C6472F;
  --color-accent-sage: #2E6B4F;
  --font-serif: 'Bricolage Grotesque', Georgia, serif;
  --font-sans: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif;
  --shadow-sm: 0 1px 2px rgba(64,44,20,.06), 0 1px 3px rgba(64,44,20,.05);
  --shadow-md: 0 2px 6px rgba(64,44,20,.07), 0 6px 16px rgba(64,44,20,.07);
  --shadow-lg: 0 4px 10px rgba(64,44,20,.08), 0 14px 34px rgba(64,44,20,.10);
  --radius: 10px;
  --transition: .25s ease;
  --r-pill: 999px;
  --r-card: 16px;
  --r-chip: 8px;
  --space-1: .35rem;
  --space-2: .6rem;
  --space-3: 1rem;
  --space-4: 1.5rem;
  --space-5: 2.25rem;
  --space-6: 3.5rem;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* One hue per exploration, drawn from the site palette. Colour is a
     wayfinding aid here (which of the four am I in?), never the only carrier
     of meaning -- every exploration is also numbered and named. */
  --e1: #1D4E89;
  --e2: #C6472F;
  --e3: #2E6B4F;
  --e4: #6A4C93;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-text);
  font-family: var(--font-sans); font-size: 1rem; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  /* Column layout so the landing page can be told to fill the window
     exactly. dvh matters on Chromebooks in tablet mode, where the visible
     height changes as the browser UI collapses. */
  display: flex; flex-direction: column;
  min-height: 100vh; min-height: 100dvh;
}
.sx { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; width: 100%; }
#sx-view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
h1, h2, h3 { margin: 0; font-weight: 600; }
p, ul, ol, dl { margin: 0; }
img { max-width: 100%; }
a { color: inherit; }

.sx { max-width: 1080px; margin: 0 auto; padding: 0 var(--space-3) var(--space-6); }
.sx :focus-visible { outline: 3px solid var(--color-accent); outline-offset: 3px; border-radius: 4px; }
.sx h1[tabindex]:focus, .sx h1[tabindex]:focus-visible { outline: none; }

/* --- the question this whole activity hangs off ------------------------- */
.hub-head { margin: var(--space-3) 0 var(--space-5); display: grid; gap: var(--space-3); }
.hub-head .sx-eyebrow { grid-column: 1 / -1; }
.hub-said { max-width: 46ch; }
@media (min-width: 860px) {
  .hub-head { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); align-items: end; column-gap: var(--space-5); }
}
.sx-question {
  font-family: var(--font-serif);
  font-size: clamp(2rem, 6.4vw, 3.4rem);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1.04;
  color: var(--color-primary);
  margin: 0 0 var(--space-3);
}
/* A highlighter on the one word the whole unit argues about. */
.hl { background: color-mix(in srgb, var(--color-accent) 48%, transparent);
  padding: 0 .1em; border-radius: 5px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.sx-eyebrow {
  font-family: var(--font-sans);
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--color-accent-warm);
  margin: 0 0 var(--space-2);
}
.sx-lede { max-width: 48ch; line-height: 1.65; font-size: 1.06rem; color: var(--color-text); margin: 0 0 var(--space-2); }
.hub-hint { max-width: 48ch; font-size: .94rem; color: var(--color-muted); margin: 0; }

/* --- hub: the four explorations ----------------------------------------
   The activity is made of pictures, so the landing page is made of pictures.
   Each card previews its own four symbols, which does the work a paragraph of
   description was doing before, and does it faster. */
.sx-explorations { display: grid; gap: var(--space-4); grid-template-columns: 1fr; }
@media (min-width: 720px) { .sx-explorations { grid-template-columns: repeat(2, 1fr); } }
.sx-ecard {
  display: flex; flex-direction: column;
  background: var(--color-card-bg);
  border: 1.5px solid var(--color-border);
  border-radius: var(--r-card);
  overflow: hidden;
  text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease);
}
.sx-ecard:hover, .sx-ecard:focus-visible {
  box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: var(--accent);
}
/* One photograph per set, edge to edge. Four thumbnails shrank to about 56px
   each at Chromebook height, which is too small to recognise anything; one
   picture at four times the size does the identifying job properly. */
.ec-art {
  display: block; overflow: hidden; background: #fff;
  aspect-ratio: 16 / 10;
  border-bottom: 3px solid var(--accent);
}
.ec-art img { width: 100%; height: 100%; min-height: 0; object-fit: cover; display: block; }
.ec-body { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4); flex: 1 1 auto; }
.ec-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.sx-ecard-num {
  font-family: var(--font-sans); font-size: .74rem; font-weight: 800;
  letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
}
.sx-ecard-title {
  font-family: var(--font-serif); font-size: clamp(1.3rem, 2.6vw, 1.6rem); font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.15; color: var(--color-primary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: calc(2 * 1.15em);
}
.sx-ecard-list {
  font-size: .92rem; line-height: 1.6; color: var(--color-muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: calc(2 * 1.6em);
}

/* Progress shows on every card, started or not, so "where were we?" is
   answered by looking rather than by remembering. */
.ec-progress { display: flex; align-items: center; gap: var(--space-2); margin-top: auto; padding-top: var(--space-2); }
.ec-bar { flex: 1 1 auto; height: 7px; border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--accent) 16%, transparent); overflow: hidden; }
.ec-bar i { display: block; height: 100%; border-radius: var(--r-pill); background: var(--accent); }
.ec-count { font-family: var(--font-sans); font-size: .8rem; font-weight: 700; color: var(--color-muted); flex: none; }
.ec-count--done { color: var(--color-accent-sage); }
.sx-partner {
  align-self: flex-start;
  font-family: var(--font-sans); font-size: .76rem; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  padding: .3rem .7rem; border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--accent);
}
.sx-done { font-size: .8rem; font-weight: 600; color: var(--color-accent-sage); font-family: var(--font-sans); }

/* --- the prompt from the paper handout, shown on screen too ------------- */
.sx-prompt {
  background: color-mix(in srgb, var(--accent) 8%, var(--color-card-bg));
  border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  border-radius: var(--r-card);
  padding: var(--space-4);
  margin: 0 0 var(--space-4);
}
.sx-prompt-q {
  font-family: var(--font-serif); font-size: 1.2rem; font-weight: 600;
  line-height: 1.45; color: var(--color-primary); margin: 0 0 var(--space-2); max-width: 58ch;
}
.sx-prompt-starter { font-size: .95rem; line-height: 1.6; color: var(--color-muted); margin: 0; max-width: 58ch; }
.sx-prompt-starter strong { color: var(--accent); font-weight: 600; }

/* --- symbol cards inside an exploration --------------------------------- */
.sx-symbols { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
.sx-scard {
  display: flex; flex-direction: column;
  background: var(--color-card-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--r-card);
  overflow: hidden; text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s var(--ease), transform .2s var(--ease);
}
.sx-scard:hover, .sx-scard:focus-visible { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.sx-scard-img { aspect-ratio: 4 / 3; background: #fff; display: block; overflow: hidden; }
.sx-scard-img img { width: 100%; height: 100%; min-height: 0; object-fit: cover; display: block; }
.sx-scard-body { padding: var(--space-3); display: flex; align-items: center; gap: var(--space-2); min-height: 44px; }
.sx-scard-title { font-family: var(--font-serif); font-size: 1.03rem; font-weight: 600; line-height: 1.3; color: var(--color-primary); }
.sx-tick { margin-left: auto; color: var(--color-accent-sage); font-weight: 700; flex: none; }

/* --- one symbol --------------------------------------------------------- */
.sx-symbol { display: grid; gap: var(--space-5); grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 800px) { .sx-symbol { grid-template-columns: 1fr; gap: var(--space-4); } }

.sx-stage {
  background: #fff; border: 1px solid var(--color-border); border-radius: var(--r-card);
  padding: var(--space-3); display: grid; place-items: center;
  aspect-ratio: 4 / 3; max-height: 62vh;
}
.sx-stage img {
  width: 100%; height: 100%; min-height: 0; object-fit: contain;
  border-radius: var(--r-chip);
}
.sx-caption {
  margin: var(--space-3) 0 0; padding: var(--space-3);
  background: color-mix(in srgb, var(--accent) 7%, var(--color-card-bg));
  border-left: 4px solid var(--accent); border-radius: var(--r-chip);
  font-size: .96rem; line-height: 1.7; max-width: 62ch;
}
.sx-caption b { display: block; font-family: var(--font-sans); font-size: .75rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--accent); margin-bottom: .3rem; }

/* Detail strip. Each thumb swaps the main stage rather than opening a
   lightbox: same "look closer" payoff, one less thing to dismiss, and it
   still works when the window is 320px wide. */
.sx-details { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-4); }
.sx-thumb {
  position: relative; width: 84px; height: 84px; padding: 5px;
  background: #fff; border: 2px solid var(--color-border); border-radius: var(--r-chip);
  cursor: pointer; display: grid; place-items: center;
  transition: border-color .15s var(--ease);
}
.sx-thumb img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
.sx-thumb[aria-pressed="true"] { border-color: var(--accent); }
.sx-thumb-tag {
  position: absolute; top: -8px; left: -8px; width: 24px; height: 24px; border-radius: var(--r-pill);
  background: var(--accent); color: #fff; font-family: var(--font-sans); font-size: .76rem; font-weight: 700;
  display: grid; place-items: center;
}

.sx-name { font-family: var(--font-serif); font-size: clamp(1.6rem, 4vw, 2.15rem); font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.2; color: var(--color-primary); margin: 0 0 var(--space-3); }
.sx-text p { max-width: 62ch; line-height: 1.75; font-size: 1.03rem; margin: 0 0 var(--space-3); text-align: left; }
.sx-deeper {
  margin-top: var(--space-3); padding-top: var(--space-3);
  border-top: 1px dashed var(--color-border);
}
.sx-deeper-tag {
  font-family: var(--font-sans); font-size: .76rem; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--color-accent-warm); margin: 0 0 var(--space-2);
}

/* --- glossary word ------------------------------------------------------ */
.sx-gloss {
  border: 0; padding: 0 1px; background: none; font: inherit; color: inherit;
  border-bottom: 2px dotted var(--color-accent-warm); cursor: help;
}
.sx-gloss-pop {
  position: absolute; z-index: 40; max-width: 270px;
  background: var(--color-primary); color: #FEFCF8;
  padding: .7rem .85rem; border-radius: var(--r-chip);
  font-size: .9rem; line-height: 1.5; box-shadow: var(--shadow-lg);
}
.sx-gloss-pop b { display: block; color: var(--color-accent); margin-bottom: .2rem; }

/* --- controls ----------------------------------------------------------- */
.sx-bar {
  position: sticky; top: 0; z-index: 30;
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  margin-bottom: var(--space-4);
  background: color-mix(in srgb, var(--color-bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--color-border);
}
.sx-btn {
  display: inline-flex; align-items: center; gap: .45rem;
  min-height: 44px; padding: .55rem 1.15rem;
  font-family: var(--font-sans); font-size: .95rem; font-weight: 600;
  border-radius: var(--r-pill); border: 1.5px solid var(--color-border);
  background: var(--color-card-bg); color: var(--color-primary);
  cursor: pointer; text-decoration: none;
  transition: background .15s var(--ease), border-color .15s var(--ease);
}
.sx-btn:hover { border-color: var(--color-primary); }
.sx-btn--speak[aria-pressed="true"] { background: var(--color-accent-warm); border-color: var(--color-accent-warm); color: #fff; }
.sx-seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--color-border);
  border-radius: var(--r-pill); overflow: hidden; background: var(--color-card-bg); max-width: 100%; }
.sx-seg button {
  min-height: 44px; padding: .5rem 1rem; border: 0; background: none; cursor: pointer;
  font-family: var(--font-sans); font-size: .9rem; font-weight: 600; color: var(--color-muted);
}
.sx-seg button[aria-pressed="true"] { background: var(--color-primary); color: #FEFCF8; }
.sx-bar-note { font-size: .82rem; color: var(--color-muted); flex-basis: 100%; margin: 0; }
.sx-spacer { flex: 1 1 auto; }

@media (prefers-reduced-motion: reduce) {
  .sx-ecard, .sx-scard, .sx-thumb { transition: none; }
  .sx-ecard:hover, .sx-scard:hover { transform: none; }
}
@media (max-width: 560px) {
  .sx-bar { gap: var(--space-1); }
  .sx-btn, .sx-seg button { padding-left: .7rem; padding-right: .7rem; font-size: .86rem; }
}
#sx-print { display: none; }

/* --- knowing where you are, and reaching the other three ---------------
   Inside a symbol the only orientation used to be a grey eyebrow and a Back
   button at the very top. Three things fix that: a coloured chip naming the
   exploration, a row of tabs for its four symbols with the current one
   marked, and a pager at the foot of the page where the reading ends. */
.sx-context { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-3); }
.sx-chip {
  display: inline-flex; align-items: center; gap: .45rem;
  padding: .32rem .8rem; border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent); font-family: var(--font-sans);
  font-size: .8rem; font-weight: 700; letter-spacing: .04em;
}
.sx-count { font-family: var(--font-sans); font-size: .82rem; font-weight: 600; color: var(--color-muted); }

.sx-tabs { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: 0 0 var(--space-4); padding: 0; list-style: none; }
.sx-tab {
  display: inline-flex; align-items: center; gap: .45rem;
  min-height: 44px; padding: .45rem .85rem;
  border: 1.5px solid var(--color-border); border-radius: var(--r-pill);
  background: var(--color-card-bg); color: var(--color-primary);
  font-family: var(--font-sans); font-size: .88rem; font-weight: 600;
  text-decoration: none; transition: border-color .15s var(--ease);
}
.sx-tab:hover { border-color: var(--accent); }
.sx-tab[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #FEFCF8; }
.sx-tab-n {
  display: grid; place-items: center; flex: none;
  width: 20px; height: 20px; border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent); font-size: .72rem; font-weight: 700;
}
.sx-tab[aria-current="page"] .sx-tab-n { background: rgba(255,255,255,.28); color: #fff; }
.sx-tab-done { color: var(--color-accent-sage); font-weight: 700; }
.sx-tab[aria-current="page"] .sx-tab-done { color: #fff; }

.sx-pager { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-5);
  padding-top: var(--space-4); border-top: 1px solid var(--color-border); }
.sx-pager a {
  display: flex; flex-direction: column; gap: .15rem;
  flex: 1 1 220px; min-height: 44px; padding: .7rem 1rem;
  border: 1.5px solid var(--color-border); border-radius: var(--r-card);
  background: var(--color-card-bg); text-decoration: none;
  transition: border-color .15s var(--ease);
}
.sx-pager a:hover { border-color: var(--accent); }
.sx-pager .pg-label { font-family: var(--font-sans); font-size: .74rem; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.sx-pager .pg-name { font-family: var(--font-serif); font-size: 1.02rem; font-weight: 600; color: var(--color-primary); line-height: 1.25; }
.sx-pager .pg-next { text-align: right; }
@media (max-width: 560px) { .sx-pager a { flex: 1 1 100%; } .sx-pager .pg-next { text-align: left; } }

.sx-foot { background: transparent; border-top: 1px solid var(--color-border);
  margin-top: var(--space-6); padding: var(--space-5) var(--space-3) var(--space-6); }
.sx-foot-inner { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); }
.sx-foot-note { margin: 0; font-size: .88rem; line-height: 1.6; color: var(--color-muted); max-width: 52ch; text-align: left; }
.sx-foot-site { margin: var(--space-2) 0 0; font-size: .84rem; color: var(--color-muted); text-align: left; }
.sx-foot-site a { color: var(--color-muted); }

/* --- landing page without a scrollbar ----------------------------------
   School Chromebooks are mostly 1366x768, which leaves roughly 650px of
   viewport once the tab strip and omnibox are taken out. On any window with
   room for it, the landing page lays itself out to fill the window exactly:
   four sets across in one row, each card's picture mosaic flexing to take
   whatever height is left over after the heading and the footer.

   Guarded on BOTH axes. Below 900px wide or 600px tall the page falls back
   to the normal scrolling layout, because a squeezed four-across grid on a
   phone would be worse than a scroll. */
@media (min-width: 900px) and (min-height: 600px) {
  /* min-height alone lets the body grow with its content, so the flex chain
     below it never receives a bounded height to divide up. Pinning the height
     is what actually makes "no scrolling" true; overflow guards against
     sub-pixel rounding rather than doing the work. */
  body.hub-fit { height: 100vh; height: 100dvh; overflow: hidden; }
  .hub-fit .sx { max-width: 1240px; }
  .hub-fit .sx-bar { padding-top: var(--space-1); padding-bottom: var(--space-1); }
  .hub-fit .sx-bar-note { margin-top: -2px; }
  .hub-fit .sx-bar-note { font-size: .8rem; }
  .hub-fit .hub-head { margin: var(--space-1) 0 var(--space-3); gap: var(--space-1); }
  /* The partner pills on the cards already say who writes. */
  .hub-fit .hub-hint { display: none; }
  /* Sized against the window height, so a shorter screen gets a smaller
     headline rather than a scrollbar. */
  .hub-fit .sx-question { font-size: clamp(1.5rem, 5vh, 2.6rem); margin-bottom: 0; }
  .hub-fit .sx-lede { font-size: 1rem; margin-bottom: .2rem; }
  .hub-fit .hub-hint { font-size: .88rem; }

  .hub-fit .sx { padding-bottom: var(--space-3); }
  .hub-fit .sx-explorations {
    flex: 1 1 auto; min-height: 0;
    grid-template-columns: repeat(4, 1fr);
    /* Without an explicit row the single grid row sizes to its content and
       pushes straight through the flex height it was given. */
    grid-template-rows: minmax(0, 1fr);
    gap: var(--space-3);
  }
  .hub-fit .sx-ecard { min-height: 0; }
  .hub-fit .ec-art { flex: 1 1 auto; min-height: 0; aspect-ratio: auto; }
  /* In a quarter-width card the partner pill wraps onto its own line and
     costs the pictures 40px of height. Floating it over the picture strip
     uses space that was empty anyway. */
  .hub-fit .sx-ecard { position: relative; }
  .hub-fit .sx-partner {
    position: absolute; top: 9px; right: 9px; z-index: 1;
    background: var(--color-card-bg);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    font-size: .66rem; padding: .22rem .5rem;
  }
  .hub-fit .ec-top { flex-wrap: nowrap; }
  .hub-fit .ec-body { padding: var(--space-3); gap: 4px; flex: 0 0 auto; }
  .hub-fit .sx-ecard-title { font-size: clamp(1rem, 2.1vh, 1.25rem); min-height: calc(2 * 1.15em); }
  .hub-fit .sx-ecard-list { font-size: .8rem; line-height: 1.45; min-height: calc(2 * 1.45em); }
  .hub-fit .sx-foot { margin-top: 0; padding: var(--space-2) var(--space-3); }
  .hub-fit .sx-foot .sx-btn { min-height: 38px; padding: .35rem .9rem; }
  .hub-fit .sx-foot-inner {
    flex-direction: row; flex-wrap: wrap; align-items: center;
    gap: var(--space-2) var(--space-3);
  }
  .hub-fit .sx-foot-note { margin: 0; font-size: .82rem; max-width: 46ch; }
  .hub-fit .sx-foot-site { margin: 0; font-size: .8rem; }
}

.sx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<style media="print" id="sx-print-css">
/* The printed handout. Kept in its own media="print" block so it can be
   flipped to media="all" to inspect the layout in a normal window.

   Deliberately toner-cheap: no background fills, no colour panels, hairline
   rules. Class sets get photocopied in black and white, so nothing here is
   allowed to depend on colour to make sense. */
@page { size: letter; margin: 16mm 15mm; }
html, body { background: #fff !important; background-image: none !important; }
body > *:not(#sx-print) { display: none !important; }
#sx-print { display: block !important; }
#sx-print * { background: transparent !important; box-shadow: none !important; color: #000 !important; }
#sx-print { font-family: var(--font-sans); color: #000; font-size: 10.5pt; line-height: 1.5; }
#sx-print .p-head { border-bottom: 1.5pt solid #000; padding-bottom: 6pt; margin-bottom: 14pt; }
#sx-print .p-head h1 { font-family: var(--font-serif); font-size: 20pt; font-weight: 600; margin: 0 0 3pt; letter-spacing: -0.01em; }
#sx-print .p-head p { margin: 1pt 0; font-size: 9.5pt; }
#sx-print .p-level { font-weight: 700; }
#sx-print .p-exp { break-before: page; page-break-before: always; }
#sx-print .p-exp:first-of-type { break-before: auto; page-break-before: auto; }
#sx-print h2 { font-family: var(--font-serif); font-size: 14pt; font-weight: 600; margin: 0 0 4pt;
  border-bottom: .75pt solid #000; padding-bottom: 3pt; }
#sx-print .p-prompt { font-size: 10pt; margin: 0 0 2pt; font-weight: 600; }
#sx-print .p-starter { font-size: 9.5pt; margin: 0 0 12pt; font-style: italic; }
#sx-print .p-sym { break-inside: avoid; page-break-inside: avoid; margin: 0 0 14pt;
  padding-bottom: 10pt; border-bottom: .5pt dotted #666; }
#sx-print .p-sym:last-child { border-bottom: 0; }
#sx-print h3 { font-family: var(--font-serif); font-size: 12.5pt; font-weight: 600; margin: 0 0 5pt; }
#sx-print .p-body { display: flex; gap: 10pt; align-items: flex-start; }
#sx-print .p-main { flex: 0 0 46mm; }
#sx-print .p-main img { width: 46mm; max-height: 46mm; object-fit: contain; display: block; }
#sx-print .p-text { flex: 1 1 auto; }
#sx-print .p-text p { margin: 0 0 6pt; max-width: 62ch; }
#sx-print .p-details { margin-top: 6pt; }
#sx-print .p-detail { display: flex; gap: 7pt; align-items: flex-start; margin: 0 0 5pt; break-inside: avoid; }
#sx-print .p-detail img { width: 18mm; max-height: 18mm; object-fit: contain; flex: none; }
#sx-print .p-detail p { margin: 0; font-size: 9.5pt; }
#sx-print .p-detail b { font-weight: 700; }
#sx-print .p-foot { margin-top: 14pt; padding-top: 5pt; border-top: .5pt solid #000; font-size: 8.5pt; }
#sx-print .p-gloss { margin-top: 10pt; font-size: 9pt; }
#sx-print .p-gloss dt { font-weight: 700; float: left; clear: left; margin-right: 5pt; }
#sx-print .p-gloss dd { margin: 0 0 2pt; }
</style>
</head>
<body>
  <main class="sx" id="sx-root">
    <div class="sx-bar" id="sx-bar"></div>
    <div id="sx-view"></div>
  </main>

  <div id="sx-print" aria-hidden="true"></div>

  <footer class="sx-foot">
    <div class="sx-foot-inner">
      <button type="button" class="sx-btn" id="sx-pdf">Download PDF</button>
      <p class="sx-foot-note">All sixteen symbols at the level you picked. Choose &#8220;Save as PDF&#8221; in the box that opens.</p>
      <p class="sx-foot-site"><a href="index.html">Mr. B&#8217;s Social Studies</a> &middot; Alderwood Middle School</p>
    </div>
  </footer>

  <script src="symbol-data.js"></script>
  <script>
  (function () {
    "use strict";

    var IMG = "symbol-images/";
    var LS_LEVEL = "symbolExploration.level";
    var LS_SEEN = "symbolExploration.seen";
    var view = document.getElementById("sx-view");
    var bar = document.getElementById("sx-bar");

    /* localStorage throws outright in some locked-down school profiles, so
       every read and write is guarded and the page works fine without it. */
    function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    var LEVELS = ["simple", "ms", "advanced"];
    var level = lsGet(LS_LEVEL, "ms");
    if (LEVELS.indexOf(level) === -1) { level = "ms"; }
    var seen = {};
    try { seen = JSON.parse(lsGet(LS_SEEN, "{}")) || {}; } catch (e) { seen = {}; }

    function markSeen(slug) { seen[slug] = 1; lsSet(LS_SEEN, JSON.stringify(seen)); }

    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    /* Longest terms first, so "assembly line" wins over "line" would-be
       matches and a short word never eats a longer phrase. */
    var GLOSS_TERMS = Object.keys(SYMBOL_GLOSSARY).sort(function (a, b) { return b.length - a.length; });
    var GLOSS_RE = new RegExp("\\b(" + GLOSS_TERMS.map(function (t) {
      return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }).join("|") + ")\\b", "gi");

    function glossify(text) {
      return esc(text).replace(GLOSS_RE, function (match) {
        var key = GLOSS_TERMS.filter(function (t) { return t.toLowerCase() === match.toLowerCase(); })[0];
        if (!key) { return match; }
        return '<button type="button" class="sx-gloss" data-term="' + esc(key) + '">' + match + "</button>";
      });
    }

    function findExploration(id) {
      return SYMBOL_EXPLORATIONS.filter(function (e) { return e.id === id; })[0];
    }
    function findSymbol(e, slug) {
      return e.symbols.filter(function (s) { return s.slug === slug; })[0];
    }
    function accentFor(e) { return "var(--" + e.id + ")"; }

    /* ---------------- speech ---------------- */
    var speaking = false;
    var canSpeak = typeof window.speechSynthesis !== "undefined"
                && typeof window.SpeechSynthesisUtterance !== "undefined";

    function stopSpeech() {
      if (!canSpeak) { return; }
      window.speechSynthesis.cancel();
      speaking = false;
      syncSpeakButton();
    }
    function speak(text) {
      if (!canSpeak) { return; }
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      u.lang = "en-US";
      u.onend = function () { speaking = false; syncSpeakButton(); };
      u.onerror = function () { speaking = false; syncSpeakButton(); };
      speaking = true;
      syncSpeakButton();
      window.speechSynthesis.speak(u);
    }
    function syncSpeakButton() {
      var b = document.getElementById("sx-speak");
      if (!b) { return; }
      b.setAttribute("aria-pressed", speaking ? "true" : "false");
      b.textContent = speaking ? "Stop reading" : "Read aloud";
    }
    function currentSpeechText() {
      var parts = [];
      var name = view.querySelector(".sx-name");
      if (name) { parts.push(name.textContent); }
      view.querySelectorAll(".sx-text p, .sx-caption").forEach(function (n) { parts.push(n.textContent); });
      return parts.join(". ");
    }

    /* ---------------- control bar ---------------- */
    function renderBar(ctx) {
      var html = "";
      if (ctx.back) {
        html += '<a class="sx-btn" href="' + ctx.back + '">&#8592; ' + esc(ctx.backLabel) + "</a>";
      }
      if (ctx.home) {
        html += '<a class="sx-btn" href="#">Home</a>';
      }
      if (ctx.back || ctx.home) { html += '<span class="sx-spacer"></span>'; }
      html += '<div class="sx-seg" role="group" aria-label="Reading level">'
           +  '<button type="button" data-level="simple" aria-pressed="' + (level === "simple") + '">Simpler</button>'
           +  '<button type="button" data-level="ms" aria-pressed="' + (level === "ms") + '">Standard</button>'
           +  '<button type="button" data-level="advanced" aria-pressed="' + (level === "advanced") + '">Advanced</button>'
           +  "</div>";
      if (ctx.symbol && canSpeak) {
        html += '<button type="button" class="sx-btn sx-btn--speak" id="sx-speak" aria-pressed="false">Read aloud</button>';
      }
      if (ctx.hub) {
        html += '<p class="sx-bar-note">All three levels say the same things &mdash; '
             +  '<strong>Simpler</strong> uses shorter sentences, <strong>Advanced</strong> adds extra detail.</p>';
      }
      bar.innerHTML = html;
      bar.hidden = !!ctx.hideBar;
      bar.style.setProperty("--accent", ctx.accent || "var(--color-primary)");
    }

    /* ---------------- views ---------------- */
    function renderHub() {
      var cards = SYMBOL_EXPLORATIONS.map(function (e) {
        var names = e.symbols.map(function (s) { return esc(s.title.replace(/^The /, "")); }).join(" &middot; ");
        var done = e.symbols.filter(function (s) { return seen[s.slug]; }).length;
        var total = e.symbols.length;
        var pct = Math.round((done / total) * 100);
        /* One tile per symbol, using that symbol's own main picture. */
        /* The set's representative symbol, named by slug in the data. The
           picture is cropped to fill, so a symbol whose subject sits high in
           its frame says where to crop from. */
        var heroSym = e.symbols.filter(function (x) { return x.slug === e.hero; })[0] || e.symbols[0];
        var heroImg = heroSym.images[0];
        var focus = heroImg.focus ? ' style="object-position:' + esc(heroImg.focus) + '"' : "";
        var art = '<span class="ec-art"><img src="' + IMG + esc(heroImg.src) + '" alt=""' + focus + "></span>";
        return '<a class="sx-ecard" href="#' + e.id + '" style="--accent:' + accentFor(e) + '">'
             + art
             + '<span class="ec-body">'
             + '<span class="ec-top">'
             +   '<span class="sx-ecard-num">Exploration ' + e.number + "</span>"
             +   '<span class="sx-partner">Partner ' + e.partner + " writes</span>"
             + "</span>"
             + '<span class="sx-ecard-title">' + esc(e.title) + "</span>"
             + '<span class="sx-ecard-list">' + names + "</span>"
             + '<span class="ec-progress">'
             +   '<span class="ec-bar"><i style="width:' + pct + '%"></i></span>'
             +   '<span class="ec-count' + (done === total ? " ec-count--done" : "") + '">'
             +     (done === total ? "All " + total + " done &#10003;" : done + " of " + total)
             +   "</span>"
             + "</span>"
             + "</span></a>";
      }).join("");

      view.innerHTML = '<header class="hub-head">'
        + '<p class="sx-eyebrow">Unit 1 &middot; Foundations &amp; Identity</p>'
        + '<h1 class="sx-question" tabindex="-1">'
        +   esc(UNIT_QUESTION).replace("American", '<span class="hl">American</span>')
        + "</h1>"
        + '<div class="hub-said">'
        +   '<p class="sx-lede">Sixteen symbols, in four sets. Pick any set to start &mdash; they work in any order.</p>'
        +   '<p class="hub-hint">One laptop between you. Take turns writing on the paper.</p>'
        + "</div>"
        + "</header>"
        + '<div class="sx-explorations">' + cards + "</div>";

      renderBar({ hub: true });
      document.body.classList.add("hub-fit");
      focusHeading();
    }

    function renderExploration(e) {
      var cards = e.symbols.map(function (s) {
        return '<a class="sx-scard" href="#' + e.id + "/" + s.slug + '">'
             + '<span class="sx-scard-img"><img src="' + IMG + esc(s.images[0].src) + '" alt="" loading="lazy"></span>'
             + '<span class="sx-scard-body"><span class="sx-scard-title">' + esc(s.title) + "</span>"
             + (seen[s.slug] ? '<span class="sx-tick" aria-label="already looked at">&#10003;</span>' : "")
             + "</span></a>";
      }).join("");

      view.innerHTML = '<div style="--accent:' + accentFor(e) + '">'
        + '<p class="sx-eyebrow">Exploration #' + e.number + "</p>"
        + '<h1 class="sx-question" tabindex="-1">' + esc(e.title) + "</h1>"
        + '<div class="sx-prompt">'
        + '<p class="sx-prompt-q">' + esc(e.prompt) + "</p>"
        + '<p class="sx-prompt-starter"><strong>Stuck?</strong> ' + esc(e.starter) + "</p>"
        + "</div>"
        + '<div class="sx-symbols">' + cards + "</div></div>";

      renderBar({ home: true, accent: accentFor(e) });
      focusHeading();
    }

    function renderSymbol(e, s) {
      markSeen(s.slug);
      var body = level === "simple" ? s.simple : s.primer;
      var deeper = level === "advanced"
        ? '<div class="sx-deeper"><p class="sx-deeper-tag">Going deeper</p><p>' + glossify(s.deeper) + "</p></div>"
        : "";

      var thumbs = s.images.length > 1
        ? '<div class="sx-details">' + s.images.map(function (img, i) {
            var tag = img.label ? '<span class="sx-thumb-tag">' + esc(img.label) + "</span>" : "";
            return '<button type="button" class="sx-thumb" data-i="' + i + '" aria-pressed="' + (i === 0) + '" '
                 + 'title="' + esc(img.title || "Main picture") + '">' + tag
                 + '<img src="' + IMG + esc(img.src) + '" alt="' + esc(img.title || "Main picture") + '"></button>';
          }).join("") + "</div>"
        : "";

      var idx = e.symbols.indexOf(s);

      /* All four symbols of this exploration, so the other three are one tap
         away and the current one is unmistakable. */
      var tabs = '<ul class="sx-tabs">' + e.symbols.map(function (sib, i) {
        var current = sib.slug === s.slug;
        return '<li><a class="sx-tab" href="#' + e.id + "/" + sib.slug + '"'
             + (current ? ' aria-current="page"' : "") + ">"
             + '<span class="sx-tab-n">' + (i + 1) + "</span>"
             + esc(sib.title.replace(/^The /, ""))
             + (seen[sib.slug] && !current ? ' <span class="sx-tab-done" aria-label="already looked at">&#10003;</span>' : "")
             + "</a></li>";
      }).join("") + "</ul>";

      var context = '<div class="sx-context">'
        + '<span class="sx-chip">Exploration #' + e.number + " &middot; " + esc(e.title) + "</span>"
        + '<span class="sx-count">Symbol ' + (idx + 1) + " of " + e.symbols.length + "</span>"
        + "</div>";

      /* Nav at the foot of the page, where the reading actually ends. At
         either end of the exploration it points back at the set of four. */
      function pagerLink(sym, dir) {
        var label = dir === "prev" ? "Previous" : "Next";
        if (!sym) {
          return '<a class="' + (dir === "next" ? "pg-next" : "") + '" href="#' + e.id + '">'
               + '<span class="pg-label">' + (dir === "prev" ? "Back to" : "Finished this set") + "</span>"
               + '<span class="pg-name">All four ' + esc(e.title.toLowerCase()) + "</span></a>";
        }
        return '<a class="' + (dir === "next" ? "pg-next" : "") + '" href="#' + e.id + "/" + sym.slug + '">'
             + '<span class="pg-label">' + label + "</span>"
             + '<span class="pg-name">' + esc(sym.title) + "</span></a>";
      }
      var pager = '<nav class="sx-pager" aria-label="Move through this exploration">'
        + pagerLink(e.symbols[idx - 1], "prev")
        + pagerLink(e.symbols[idx + 1], "next")
        + "</nav>";

      view.innerHTML = '<div style="--accent:' + accentFor(e) + '">'
        + context
        + '<h1 class="sx-name" tabindex="-1">' + esc(s.title) + "</h1>"
        + tabs
        + '<div class="sx-symbol">'
        + "<div>"
        + '<div class="sx-stage"><img id="sx-stage-img" src="' + IMG + esc(s.images[0].src) + '" alt="' + esc(s.images[0].alt) + '"></div>'
        + thumbs
        + '<div id="sx-cap"></div>'
        + "</div>"
        + '<div class="sx-text">'
        + "<p>" + glossify(body) + "</p>"
        + deeper
        + "</div></div>"
        + pager
        + "</div>";

      showImage(s, 0);
      renderBar({ home: true, back: "#" + e.id, backLabel: e.title, symbol: true, accent: accentFor(e) });

      var stage = document.getElementById("sx-stage-img");
      view.querySelectorAll(".sx-thumb").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var i = Number(btn.getAttribute("data-i"));
          view.querySelectorAll(".sx-thumb").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
          btn.setAttribute("aria-pressed", "true");
          stage.src = IMG + s.images[i].src;
          stage.alt = s.images[i].alt;
          showImage(s, i);
        });
      });
      focusHeading();
    }

    /* Captions carry nearly as many words as the body text, so they follow the
       reading level too. Without this a student on Simpler read a short-sentence
       explanation and then a caption written for somebody three grades above. */
    function captionFor(img) {
      return level === "simple" && img.captionSimple ? img.captionSimple : img.caption;
    }

    function showImage(s, i) {
      var cap = document.getElementById("sx-cap");
      if (!cap) { return; }
      var img = s.images[i];
      cap.innerHTML = img.caption
        ? '<p class="sx-caption"><b>' + esc((img.label ? img.label + " · " : "") + (img.title || "")) + "</b>"
          + glossify(captionFor(img)) + "</p>"
        : "";
    }

    function focusHeading() {
      var h = view.querySelector("h1");
      if (h) { h.focus({ preventScroll: true }); }
      window.scrollTo(0, 0);
    }

    /* ---------------- glossary popover ---------------- */
    var pop = null;
    function closePop() { if (pop) { pop.remove(); pop = null; } }
    document.addEventListener("click", function (ev) {
      var g = ev.target.closest ? ev.target.closest(".sx-gloss") : null;
      closePop();
      if (!g) { return; }
      ev.preventDefault();
      var term = g.getAttribute("data-term");
      pop = document.createElement("div");
      pop.className = "sx-gloss-pop";
      pop.setAttribute("role", "status");
      pop.innerHTML = "<b>" + esc(term) + "</b>" + esc(SYMBOL_GLOSSARY[term] || "");
      document.body.appendChild(pop);
      var r = g.getBoundingClientRect();
      var top = r.bottom + window.scrollY + 8;
      var left = Math.min(r.left + window.scrollX, window.innerWidth - pop.offsetWidth - 12);
      pop.style.top = top + "px";
      pop.style.left = Math.max(8, left) + "px";
    });
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { closePop(); stopSpeech(); } });

    /* ---------------- printable version ----------------
       Built from the same data as the screen, at whichever level is selected,
       and handed to the browser's own print pipeline. That keeps the text real
       and selectable in the saved PDF, uses the page's actual fonts, and adds
       no library to a site that otherwise ships no dependencies. */
    var LEVEL_NAMES = { simple: "Simpler", ms: "Standard", advanced: "Advanced" };

    function buildPrintDoc() {
      var root = document.getElementById("sx-print");
      var out = '<div class="p-head">'
        + "<h1>Symbol Exploration</h1>"
        + "<p>Unit 1 &middot; Foundations &amp; Identity &mdash; " + esc(UNIT_QUESTION) + "</p>"
        + '<p class="p-level">Reading level: ' + esc(LEVEL_NAMES[level] || level) + "</p>"
        + "</div>";

      var usedTerms = {};
      function collect(text) {
        String(text).replace(GLOSS_RE, function (m) {
          var key = GLOSS_TERMS.filter(function (t) { return t.toLowerCase() === m.toLowerCase(); })[0];
          if (key) { usedTerms[key] = 1; }
          return m;
        });
      }

      SYMBOL_EXPLORATIONS.forEach(function (e) {
        out += '<section class="p-exp">'
            +  "<h2>Exploration #" + e.number + " &middot; " + esc(e.title) + "</h2>"
            +  '<p class="p-prompt">Partner ' + e.partner + " writes: " + esc(e.prompt) + "</p>"
            +  '<p class="p-starter">Stuck? ' + esc(e.starter) + "</p>";

        e.symbols.forEach(function (sym) {
          var body = level === "simple" ? sym.simple : sym.primer;
          collect(body);
          out += '<article class="p-sym"><h3>' + esc(sym.title) + "</h3>"
              +  '<div class="p-body">'
              +  '<div class="p-main"><img src="' + IMG + esc(sym.images[0].src) + '" alt=""></div>'
              +  '<div class="p-text"><p>' + esc(body) + "</p>";
          if (level === "advanced") {
            collect(sym.deeper);
            out += "<p>" + esc(sym.deeper) + "</p>";
          }
          /* Two symbols carry a caption on their FIRST image, which is also the
             main picture. Show that caption under the main picture rather than
             repeating the image in the detail list. */
          if (sym.images[0].caption) {
            collect(captionFor(sym.images[0]));
            out += '<div class="p-details"><div class="p-detail"><p><b>'
                +  esc((sym.images[0].label ? sym.images[0].label + " \u00b7 " : "") + (sym.images[0].title || ""))
                +  "</b> " + esc(captionFor(sym.images[0])) + "</p></div></div>";
          }
          var details = sym.images.slice(1).filter(function (i) { return i.caption; });
          if (details.length) {
            out += '<div class="p-details">';
            details.forEach(function (i) {
              collect(captionFor(i));
              out += '<div class="p-detail"><img src="' + IMG + esc(i.src) + '" alt="">'
                  +  "<p><b>" + esc((i.label ? i.label + " \u00b7 " : "") + (i.title || "")) + "</b> "
                  +  esc(captionFor(i)) + "</p></div>";
            });
            out += "</div>";
          }
          out += "</div></div></article>";
        });
        out += "</section>";
      });

      var terms = Object.keys(usedTerms).sort(function (a, b) {
        return a.toLowerCase().localeCompare(b.toLowerCase());
      });
      if (terms.length) {
        out += '<div class="p-gloss"><h2>Words to know</h2><dl>';
        terms.forEach(function (t) {
          out += "<dt>" + esc(t) + "</dt><dd>" + esc(SYMBOL_GLOSSARY[t]) + "</dd>";
        });
        out += "</dl></div>";
      }
      out += '<p class="p-foot">mrbsocialstudies.org/symbol-exploration.html &middot; '
          +  esc(LEVEL_NAMES[level] || level) + " version &middot; Mr. B&#8217;s Social Studies</p>";
      root.innerHTML = out;
      return root;
    }

    function imagesReady(root) {
      var imgs = [].slice.call(root.querySelectorAll("img"));
      var pending = imgs.filter(function (i) { return !i.complete || i.naturalWidth === 0; });
      if (!pending.length) { return Promise.resolve(); }
      return Promise.race([
        Promise.all(pending.map(function (i) {
          return new Promise(function (res) { i.addEventListener("load", res); i.addEventListener("error", res); });
        })),
        /* never let one slow image block the print dialog */
        new Promise(function (res) { setTimeout(res, 6000); })
      ]);
    }

    function downloadPdf() {
      var btn = document.getElementById("sx-pdf");
      if (btn) { btn.disabled = true; btn.textContent = "Preparing\u2026"; }
      stopSpeech();
      var root = buildPrintDoc();
      imagesReady(root).then(function () {
        if (btn) { btn.disabled = false; btn.textContent = "Download PDF"; }
        window.print();
      });
    }

    /* ---------------- bar interactions ---------------- */
    bar.addEventListener("click", function (ev) {
      var lv = ev.target.closest ? ev.target.closest("[data-level]") : null;
      if (lv) {
        level = lv.getAttribute("data-level");
        lsSet(LS_LEVEL, level);
        stopSpeech();
        route();
        return;
      }
      if (ev.target.id === "sx-speak") {
        if (speaking) { stopSpeech(); } else { speak(currentSpeechText()); }
        return;
      }
      if (ev.target.id === "sx-pdf") { downloadPdf(); }
    });

    /* ---------------- routing ----------------
       Hash routing keeps the browser Back button working and makes every
       symbol linkable on its own, so a single symbol can be posted straight
       into Canvas without landing students on the hub first. */
    function route() {
      stopSpeech();
      closePop();
      /* Only the landing page is pinned to the window height; every other
         view scrolls as much as its content needs. */
      document.body.classList.remove("hub-fit");
      var hash = (location.hash || "").replace(/^#/, "");
      if (!hash) { renderHub(); return; }
      var parts = hash.split("/");
      var e = findExploration(parts[0]);
      if (!e) { renderHub(); return; }
      if (parts.length === 1) { renderExploration(e); return; }
      var s = findSymbol(e, parts[1]);
      if (!s) { renderExploration(e); return; }
      renderSymbol(e, s);
    }

    document.getElementById("sx-pdf").addEventListener("click", downloadPdf);

    window.addEventListener("hashchange", route);
    route();
  }());
  </script>
</body>
</html>

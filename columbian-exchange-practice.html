:root[data-theme="dark"]{--ink:#eceae5;--muted:#a8a49c;--rule:#3a3a38;--bg:#16161a;
  --card:#1e1e22;--accent:#8fc3a8;--band:#23302a;}
*{box-sizing:border-box;}
html{font-size:18px;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Georgia,serif;
  font-size:1rem;line-height:1.7;text-align:left;}
.wrap{max-width:34rem;margin:0 auto;padding:1.5rem 1rem 4rem;}
/* Measure: WCAG 2.2 SC 1.4.8 caps a line at 80 characters and Dyson & Haselgrove
   2001 measured the optimum nearer 55. 38rem at 18px lands inside that. */
header.top{border-bottom:2px solid var(--accent);padding-bottom:.75rem;margin-bottom:1.5rem;}
h1{font-size:1.5rem;line-height:1.25;margin:0 0 .25rem;}
.lvl{font-size:.95rem;color:var(--muted);margin:0 0 .75rem;}
/* Sticky at the top rather than the bottom: the level switcher is most wanted in
   the first seconds ("is this the right one for me?"), a bottom bar covers the
   line you are reading on a short Chromebook window, and iOS Safari's own chrome
   already owns the bottom edge. */
.snav{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--rule);width:100%;}
.snavin{max-width:46rem;margin:0 auto;padding:.4rem 1rem;display:flex;gap:.75rem;
  align-items:center;justify-content:space-between;flex-wrap:wrap;}
.snav a,.snav span[aria-current]{font-size:.85rem;padding:.3rem .6rem;border:1px solid var(--rule);
  border-radius:.4rem;text-decoration:none;color:var(--ink);background:var(--card);display:inline-block;}
.snav span[aria-current]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.sgroup,.sjump{display:flex;gap:.3rem;flex-wrap:wrap;}
.sjump a{background:transparent;border-color:transparent;color:var(--muted);padding:.3rem .4rem;}
.sjump a:hover,.sjump a:focus{color:var(--accent);border-color:var(--rule);}
/* Anchors clear the bar by measuring it. The bar wraps on a narrow screen, so a
   fixed offset is wrong on some width or other; JS keeps --navh honest. */
h2,h3,.vbox{scroll-margin-top:calc(var(--navh, 3.6rem) + .6rem);}

/* Reading progress. aria-hidden on purpose: a screen-reader user already knows
   where they are, and a percentage announcing itself on every scroll is noise. */
.progress{position:fixed;right:.6rem;top:50%;transform:translateY(-50%);z-index:15;
  display:flex;flex-direction:column;align-items:center;gap:.4rem;}
.ptrack{width:4px;height:38vh;background:var(--rule);border-radius:2px;overflow:hidden;}

@media (max-width:640px){.progress{display:none;}

.reading{margin:0 0 3rem;}
h2{font-size:1.3rem;line-height:1.3;margin:2.5rem 0 .15rem;color:var(--accent);}
.colonies{font-size:.92rem;color:var(--muted);margin:0 0 1rem;}
h3{font-size:1.05rem;margin:1.75rem 0 .4rem;line-height:1.35;}
p{margin:0 0 1rem;}
b{font-weight:700;}
.vbox{background:var(--band);border-radius:.5rem;padding:.9rem 1.1rem;margin:0 0 2rem;}
.vbox .vh{font-size:1rem;margin:0 0 .2rem;text-transform:uppercase;letter-spacing:.05em;}
.vbox .vsub{font-size:.9rem;color:var(--muted);margin:0 0 .7rem;}
.vbox .rtag{font-size:.75rem;font-weight:400;color:var(--muted);text-transform:uppercase;

.vbox dl{margin:0;}

.help p{margin:0 0 .5rem;}
.help p:last-child{margin:0;}

.sources p{font-size:.95rem;}
.sources ul{margin:0;padding-left:1.1rem;}
.sources li{margin-bottom:.7rem;}
.sources a{color:var(--accent);}
.sources .sd{display:block;font-size:.9rem;color:var(--muted);line-height:1.5;}
.sources .sn{font-size:.85rem;color:var(--muted);}
.sources .sn2{font-size:.9rem;color:var(--muted);margin:0 0 .6rem;}
.sources ul.links li{margin-bottom:.35rem;}
.pick{display:block;border:1px solid var(--rule);background:var(--card);border-radius:.6rem;

.pick:hover,.pick:focus{border-color:var(--accent);}
.pick b{display:block;font-size:1.15rem;color:var(--accent);margin-bottom:.15rem;}
.pick .wc{display:block;font-size:.9rem;color:var(--muted);margin-top:.3rem;}
/* Level 0's door to Level 1, one per section. Quiet on purpose: it is an offer,
   not an instruction, and it must not read as "you should be on Level 1". */
.up{font-size:.9rem;margin:-.35rem 0 1.1rem;}
.up a{color:var(--accent);}
@media print{.up{display:none;}}
/* Screen hides the paper-only note; print re-shows it. Declared BEFORE the print
   block, because equal-specificity rules are resolved by order, media query or not. */
.weblink{display:none;}

/* ---------------------------------------------------------------------------
   PRINT. The paper version is this same page printed, not a second layout --
   that is what keeps the text, the glosses and the sources identical to the web
   version rather than nearly identical.

   Three things it has to undo. Dark mode must not reach paper, so the whole
   palette is redefined here rather than trusted to the renderer's colour
   scheme. Colour carries no meaning on these handouts because they are
   photocopied in black and white, so accents become black and the vocabulary
   box becomes a rule instead of a filled panel -- a tinted box behind every
   region, three to a reading, is a lot of toner for decoration. And a link is
   useless on paper, so the sources keep their names (which are descriptive
   enough to search) and the page says once where to go to click them.
   --------------------------------------------------------------------------- */
@media print{
  :root,:root[data-theme="dark"]{--ink:#000;--muted:#333;--rule:#999;--bg:#fff;
    --card:#fff;--accent:#000;--band:#fff;}
  @page{size:letter portrait;margin:.7in .75in;}
  /* 11pt, not 11.5. Each region starts its own sheet, so a region that runs four
     lines past the bottom leaves a near-empty page behind it -- at 11.5pt that was
     happening to New England at every level. Still well inside the 10-12pt range a
     handout wants. */
  html{font-size:11pt;}
  body{background:#fff;color:#000;line-height:1.45;}
  .wrap{max-width:none;padding:0;}
  .snav,.progress,.sjump,.help{display:none;}
  header.top{border-bottom:1.5pt solid #000;}
  h1{font-size:1.5rem;}
  /* A heading stranded at the foot of a page costs a sheet in a class set. */
  h2,h3{break-after:avoid;page-break-after:avoid;}
  h2{font-size:1.25rem;margin-top:1.4rem;}
  h3{font-size:1.02rem;margin-top:1rem;}
  p{orphans:3;widows:3;margin-bottom:.5rem;}
  .reading{break-inside:auto;}
  /* The seven words are the thing a student flips back to, so never split it. */
  /* Every section starts at the top of a sheet. A region heading halfway down a
     page, under the tail of the previous region, is the thing that makes a printed
     packet hard to navigate -- you cannot flip to a section that does not begin
     anywhere. It costs sheets and buys a findable handout. */
  .vbox{background:#fff;border:none;border-radius:0;padding:0;
    break-after:page;page-break-after:always;}
  .vbox .vh{font-size:1.15rem;border-bottom:1.5pt solid #000;padding-bottom:.2rem;
    margin-bottom:.3rem;}
  .vbox dt{margin-top:.55rem;font-size:1rem;}
  .vbox dd{margin-left:0;}
  .vbox .rtag{font-size:.8rem;}
  .reading{break-before:page;page-break-before:always;margin-bottom:0;}
  .sources{break-before:page;page-break-before:always;}

  /* Hierarchy has to survive losing colour. h2 is the region and rules off; h3 is
     the question inside it and sits in small caps with air above, so the two never
     read as the same level on a photocopy. */
  h2{font-size:1.35rem;border-bottom:1pt solid #000;padding-bottom:.15rem;
    margin:0 0 .15rem;}
  h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;
    margin:.8rem 0 .22rem;}
  .colonies{font-style:italic;margin-bottom:.65rem;}
  /* The seven words are bolded on first use. On paper that has to be visible at a
     glance, since there is no colour to carry it. */
  .reading b{font-weight:700;letter-spacing:.01em;}

  /* Sources, condensed: who holds each one stays, the sentence explaining why it
     is here goes, and "read more" collapses to a run-on list. */
  .sources .sexp,.sources .sn,.sources .sn2,.sources p:first-of-type{display:none;}
  .sources ul.links{padding-left:0;}
  .sources ul.links li{display:inline;margin:0;}
  .sources ul.links li::after{content:" · ";}
  .sources ul.links li:last-child::after{content:"";}
  .sources ul.links a{font-weight:400;}
  .sources li{margin-bottom:.35rem;}
  .sources .sd{display:inline;color:#333;}
  .sources .sd::before{content:" — ";}
  .vbox dd{font-size:.95rem;}
  /* Let the sources flow onto whatever page they reach. Forcing them to a fresh
     sheet cost a page per level, on a handout printed as a class set. */
  .sources{border-top:1.5pt solid #000;}
  .sources a{color:#000;text-decoration:none;font-weight:700;}
  .sources li{break-inside:avoid;}
  .weblink{display:block;margin-bottom:.5rem;}
  footer{border-top:1pt solid var(--rule);}
}

/* Two extra tokens, declared the same three ways the page declares its own, so
   the activity follows the reading into dark mode instead of being a white card
   with pale text on it. That was the first version's bug: literal backgrounds
   with text left inheriting --ink, which dark mode flips to near-white. */
:root{--ract-row:#f4f1ea;--ract-on-accent:#fff;--ract-warn:#7a4f24;--ract-muted:#4f4a42;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ract-row:#26262b;--ract-on-accent:#16161a;--ract-warn:#e0b57c;--ract-muted:#c4c0b8;}}
:root[data-theme="dark"]{--ract-row:#26262b;--ract-on-accent:#16161a;
  --ract-warn:#e0b57c;--ract-muted:#c4c0b8;}
#activities{margin:2.5rem 0 0;color:var(--ink);scroll-margin-top:5rem;}
/* The two calls to action: one in the sticky menu, one under the words box --
   the two moments a student has just met the definitions and might want to use
   them. Both are real links to #activities, so they work with the page's own
   smooth scrolling and need no script. */
.snav .sgo{background:var(--accent);color:var(--ract-on-accent);font-weight:700;
  border-radius:999px;padding:.2rem .7rem;text-decoration:none;}
.vcta-end{margin-top:2rem;}
.vcta{display:block;margin:1.1rem 0 0;padding:.75rem .9rem;border-radius:.55rem;
  border:2px solid var(--accent);background:var(--band);color:var(--ink);
  text-decoration:none;min-height:44px;}
.vcta b{display:block;color:var(--accent);font-size:1.05rem;}
/* --band is the darkest surface on the page, so even the activity's own muted
   only reaches 3.56:1 on it. The CTA subline uses full --ink instead. */
.vcta span{display:block;font-size:.92rem;color:var(--ink);margin-top:.15rem;}
@media print{.vcta,.snav .sgo{display:none;}}
.ract-h{font-size:1.5rem;margin:0 0 .3rem;color:var(--ink);}
.ract-lead{margin:0 0 1.1rem;color:var(--ract-muted);}
.ract-round{border:2px solid var(--rule);border-radius:.7rem;padding:1rem 1.1rem;
  margin:0 0 1.1rem;background:var(--card);}
.ract-rlab{margin:0 0 .2rem;font-size:1.15rem;color:var(--accent);}
.ract-stage{margin:1.2rem 0 0;padding-top:.9rem;border-top:1px solid var(--rule);}
.ract-stage:first-of-type{border-top:0;padding-top:0;margin-top:0;}
.ract-stage h4{margin:0 0 .25rem;font-size:1.05rem;color:var(--ink);}
.ract-help{margin:0 0 .6rem;font-size:.95rem;color:var(--ract-muted);}
.ract-row{padding:.6rem .7rem;margin:0 0 .45rem;border-radius:.45rem;
  background:var(--ract-row);color:var(--ink);display:flex;flex-wrap:wrap;
  gap:.5rem;align-items:baseline;}
.ract-row.ract-ok{background:var(--band);}
.ract-def{flex:1 1 15rem;}
.ract-sent{flex:1 1 100%;line-height:2.1;}
.ract-ans{color:var(--accent);font-weight:700;}
/* color and background are set explicitly: a bare <select> or <input> keeps the
   browser's own black-on-white and disappears against a dark card. */
.ract-sel,.ract-in{font:inherit;font-size:1rem;padding:.35rem .4rem;
  border:2px solid var(--rule);border-radius:.3rem;background:var(--card);
  color:var(--ink);min-height:44px;}
.ract-in{min-width:10rem;}
.ract-again{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ract-warn);font-weight:700;}
.ract-pair{display:block;}
.ract-scen{margin:0 0 .55rem;color:var(--ink);}
.ract-opts{display:flex;flex-wrap:wrap;gap:.6rem;}
/* 44px minimum touch target: these get used on Chromebooks and phones. */
.ract-opt{font:inherit;font-size:1rem;padding:.6rem 1.1rem;cursor:pointer;
  min-height:44px;border:2px solid var(--rule);border-radius:.45rem;
  background:var(--card);color:var(--ink);}
.ract-opt.ract-picked{border-color:var(--accent);background:var(--band);
  font-weight:700;}
.ract-why{margin:.4rem 0 0;color:var(--ink);}
.ract-bar{display:flex;align-items:center;gap:.8rem;margin-top:.6rem;flex-wrap:wrap;}
/* --accent is a deep green in light mode and a pale one in dark, so the label on
   top of it has to flip too, or it is white-on-mint. */
.ract-check{font:inherit;font-size:1rem;font-weight:700;padding:.6rem 1.3rem;
  cursor:pointer;min-height:44px;color:var(--ract-on-accent);
  background:var(--accent);border:0;border-radius:.45rem;}
.ract-score{color:var(--ract-muted);}
.ract-score.ract-won{color:var(--accent);font-weight:700;}
.ract-ta{font:inherit;width:100%;padding:.5rem;border:2px solid var(--rule);
  border-radius:.3rem;background:var(--card);color:var(--ink);}
.ract-saved{font-size:.85rem;color:var(--accent);}
.ract-opt-tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ract-warn);font-weight:700;margin-left:.4rem;}
.ract-sum{border:3px solid var(--accent);border-radius:.7rem;padding:1rem 1.1rem;
  background:var(--card);}
.ract-sum h4{margin:0 0 .6rem;font-size:1.25rem;color:var(--ink);}
/* Deliberately large: this table gets read by an adult standing up. */
.ract-tbl{border-collapse:collapse;width:100%;max-width:30rem;font-size:1.15rem;
  color:var(--ink);}
.ract-tbl th{text-align:left;font-size:.8rem;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ract-muted);border-bottom:2px solid var(--rule);
  padding:.3rem .35rem;}
.ract-tbl td{padding:.35rem;border-bottom:1px solid var(--rule);}
.ract-tbl td.ract-won{color:var(--accent);font-weight:700;}
.ract-stagewrap{min-height:12rem;}
/* Meet the words. Cards, not a list: each is its own tap target, and a closed
   card is a question ("what does this mean?") where an open list is a thing to
   scroll past. */
.ract-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));
  gap:.6rem;margin:0 0 .4rem;align-items:start;}
.ract-card{border:2px solid var(--rule);border-radius:.55rem;background:var(--card);
  color:var(--ink);overflow:hidden;}
.ract-card.ract-open{border-color:var(--accent);}
.ract-cardbtn{font:inherit;display:block;width:100%;text-align:left;cursor:pointer;
  padding:.65rem .8rem;min-height:44px;border:0;background:var(--ract-row);
  color:var(--ink);}
.ract-cardbtn b{display:block;font-size:1.1rem;}
.ract-tap{display:block;font-size:.85rem;color:var(--ract-muted);}
.ract-open .ract-tap{display:none;}
.ract-cardbody{display:none;padding:.55rem .8rem .7rem;}
.ract-open .ract-cardbody{display:block;}
.ract-simple{margin:0;font-size:1rem;}
/* The step bar is the only always-visible control, so it carries the position.
   "Step 3 of 6" is doing real work here: one stage on screen with no count is a
   corridor with no end, which is worse than the scroll it replaced. */
.ract-nav{display:flex;align-items:center;gap:.8rem;margin-top:1.1rem;
  padding-top:.8rem;border-top:1px solid var(--rule);flex-wrap:wrap;}
.ract-prog{color:var(--ract-muted);font-size:.92rem;margin:0 auto;}
.ract-step{font:inherit;font-size:1rem;font-weight:700;padding:.55rem 1.1rem;
  cursor:pointer;min-height:44px;border:2px solid var(--rule);border-radius:.45rem;
  background:var(--card);color:var(--ink);}
/* A finished stage makes Next the obvious thing to press, without disabling it
   beforehand -- a student who wants to skip ahead and come back may. */
.ract-step.ract-ready{background:var(--accent);color:var(--ract-on-accent);
  border-color:var(--accent);}
.ract-tot td{border-top:2px solid var(--rule);font-weight:700;}
.ract-restart{font:inherit;font-size:.95rem;margin-top:.9rem;padding:.5rem 1rem;
  cursor:pointer;min-height:44px;border:2px solid var(--rule);border-radius:.45rem;
  background:var(--card);color:var(--ract-muted);}
@media print{.ract-nav{display:none;}}
/* The marked words. A <button> inside a paragraph inherits none of the prose's
   typography by default, so every one of these resets is load-bearing: without
   them the reading reflows around forty little grey boxes. */
.vpop{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;
  /* A button does not inherit text-transform, so inside an uppercase heading the
     word printed in mixed case: "WHAT THE Columbian Exchange WAS". */
  text-transform:inherit;letter-spacing:inherit;
  cursor:help;display:inline;text-align:inherit;line-height:inherit;
  border-bottom:2px dotted var(--accent);}
.vpop:hover,.vpop:focus{background:var(--band);border-bottom-style:solid;}
.vpop:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
b .vpop{font-weight:inherit;}
.vpop-bubble{position:absolute;z-index:60;max-width:22rem;padding:.6rem .75rem;
  border:2px solid var(--accent);border-radius:.45rem;background:var(--card);
  color:var(--ink);font-size:.95rem;line-height:1.5;
  box-shadow:0 6px 24px rgba(0,0,0,.28);}
/* On paper a dotted underline is just noise -- there is nothing to hover. */
@media print{.vpop{border-bottom:0;}.vpop-bubble{display:none;}}
@media print{#activities{display:none;}}

.pback{display:inline-block;margin-top:1.5rem;color:var(--accent);}
</style>

<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proclamation Line Locks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap">
<style>
/* Layout: one working card per lock, a row of five wax seals above it; #board turns the page into a projector view. */
:root{
  --bg:#F5F0E8; --surface:#FFFFFF; --ink:#1F2124; --muted:#5B5651; --line:#D6CFC3;
  --deep:#7A2A28; --accent:#B23A34; --tint:#F6E7E4; --ok:#2F6B45; --ok-tint:#E4F0E8; --warn:#8A5A00; --warn-tint:#FBF0D9;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1918; --surface:#262120; --ink:#F1ECE6; --muted:#B7ADA5; --line:#46403C;
  --deep:#E49A92; --accent:#E07A70; --tint:#3A2624; --ok:#8FD0A5; --ok-tint:#1F3328; --warn:#E8C27A; --warn-tint:#3A3020; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1C1918; --surface:#262120; --ink:#F1ECE6; --muted:#B7ADA5; --line:#46403C;
  --deep:#E49A92; --accent:#E07A70; --tint:#3A2624; --ok:#8FD0A5; --ok-tint:#1F3328; --warn:#E8C27A; --warn-tint:#3A3020; color-scheme:dark;}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;padding-inline:16px;padding-block:20px 40px;margin:0;}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}
h1,h2{font-family:var(--display);color:var(--deep);margin:0;text-wrap:balance;line-height:1.15;}
h1{font-size:clamp(28px,6vw,40px);}
h2{font-size:clamp(23px,4.6vw,30px);}
p{margin:0;}
.kicker{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em;}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;}
.seals{display:flex;gap:10px;flex-wrap:wrap;}
.seal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;
  border:2px dashed var(--line);color:var(--muted);background:var(--surface);}
.seal.open{border:2px solid var(--accent);background:var(--accent);color:#fff;}
.seal.now{border:2px solid var(--deep);color:var(--deep);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;}
.card.lock{border-top:6px solid var(--accent);}
label{font-weight:700;font-size:16px;display:block;margin-bottom:5px;}
input[type=text],input[type=number],input[type=password]{width:100%;font:inherit;font-size:26px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);}
input.plain{text-transform:none;letter-spacing:0;font-size:20px;font-weight:600;}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
button{font:inherit;font-weight:800;font-size:18px;border-radius:8px;padding:12px 20px;cursor:pointer;border:2px solid var(--deep);}
button.primary{background:var(--deep);color:var(--surface);}
button.ghost{background:transparent;color:var(--deep);}
button:disabled{opacity:.45;cursor:not-allowed;}
.msg{border-radius:8px;padding:12px 14px;font-weight:600;}
.msg.bad{background:var(--warn-tint);color:var(--warn);}
.msg.good{background:var(--ok-tint);color:var(--ok);}
.hint{background:var(--tint);border-radius:8px;padding:12px 14px;}
.hint b{color:var(--deep);}
.reveal{background:var(--ok-tint);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;}
.reveal .env{font-family:var(--display);font-size:24px;color:var(--ok);}
ol,ul{margin:0;padding-left:22px;}
li{margin-bottom:4px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-variant-numeric:tabular-nums;}
.stat{background:var(--bg);border-radius:8px;padding:12px;text-align:center;}
.stat b{display:block;font-size:30px;font-family:var(--display);color:var(--deep);}
footer{display:flex;justify-content:flex-end;}
.link{background:none;border:none;color:var(--muted);font-weight:600;font-size:14px;padding:4px;text-decoration:underline;}
.teacher{border-style:dashed;}
/* board */
.board .wrap{max-width:1100px;}
.timer{font-family:var(--display);font-size:clamp(70px,16vw,170px);color:var(--deep);font-variant-numeric:tabular-nums;line-height:1;text-align:center;}
.timer.low{color:var(--accent);}
.board-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
.board-grid > *{min-width:0;}
.board p,.board li{font-size:22px;}
@media (max-width:760px){.board-grid{grid-template-columns:1fr;}}
@media (max-width:480px){.stats{grid-template-columns:1fr;}}
@media (prefers-reduced-motion:no-preference){.reveal{animation:rise .35s ease-out;}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap" id="app"></div>

<script>
const LOCKS = [{"n": 1, "title": "The Line", "ask": "Which places are west of the line, on land the King reserved for Native nations?", "fields": ["Lock 1 code (4 digits)"], "sort": false, "h": ["f97577ee"], "hints": ["Read each card’s clue and find its pin on the map. The lakes, the rivers and the coast are your landmarks.", "The dashed line runs along the mountains. Four pins are west of it. Read their cards’ digits in pin order, A to H."], "reveal": "Every place west of the line was home to Native nations, and British forts there were under attack in 1763. The King closed this land to colonial settlement."}, {"n": 2, "title": "The King’s Order", "ask": "What does the King’s order spell?", "fields": ["Lock 2 code (a word)"], "sort": false, "h": ["3906131a"], "hints": ["Lines 1, 2 and 3 are one long sentence split in three. Start with the strip that says the order is “just and reasonable.”", "Look for the same idea in both: “molested or disturbed” = left alone; “Hunting Grounds” = lands to hunt on; “forthwith … remove” = leave right away. Then read the letters in order, 1 to 5."], "reveal": "PEACE. The King wanted peace with the Native nations. Pontiac’s War had begun that spring, and Britain, already deep in debt, could not afford another long war."}, {"n": 3, "title": "Washington’s Secret", "ask": "What did Washington plan to do?", "fields": ["Lock 3 code (a word)"], "sort": false, "h": ["86c993cb"], "hints": ["Check the box at the top of the letter: who wrote it, to whom, and when. The Proclamation was 1763.", "Five statements are supported and three are not. Look at who the letter was for, and whether Washington wanted to obey the line."], "reveal": "CLAIM. Washington planned to claim western land the Proclamation had closed, and he bet the line would not last. Can we trust this letter? It was private, so it may show what he really thought."}, {"n": 4, "title": "Three Voices", "ask": "Which cards belong to Washington, and which to Pontiac?", "fields": ["Washington’s 3 card letters", "Pontiac’s 3 card letters"], "sort": true, "h": ["8a6ba812", "05b1d62b"], "hints": ["For each card, ask: is this the person who made the rule, the colonist who wanted land, or the leader whose people lived there?", "Each person has exactly three cards. The King’s cards are about peace, safety and control. Washington’s are about land and secrets."], "reveal": "All three wanted the same land, for different reasons. Before you open Envelope 5, talk it out: whose claim to this land was strongest, and why? Write it on your group sheet."}, {"n": 5, "title": "The Bill Comes Due", "ask": "What happened when Britain made the colonists help pay the bill?", "fields": ["Lock 5 code (3 digits)"], "sort": false, "h": ["36610640"], "hints": ["Put the events in cause-and-effect order first. What had to happen before colonists stopped buying British goods?", "One word card does not belong: check its date. Then read the word cards’ digits in the order of the events."], "reveal": "You escaped. The boycott helped: Parliament repealed the Stamp Act in 1766. But Britain still needed money, and in 1767 Parliament passed new taxes. Tomorrow’s question: should you have to pay for something you don’t get a vote on?"}];
const MISSION = ["October 1763. Britain has won the French &amp; Indian War, and it owes more money than ever. One thing is true about all wars: they’re expensive. Now King George III has drawn a line on the map.", "Your group will find out what that line meant to the King, to colonists like George Washington, and to Native nations like Pontiac’s, and what Britain did next to pay its bill."];
const RULES = ["Open <b>one envelope at a time</b>. Each puzzle gives you a code.", "Type the code into the lock page. Right: open the next envelope. Wrong: the lock freezes for one minute.", "Write your work on the group sheet. Every person in the group does some of the reading.", "Stuck? The lock page has two hints for every lock."];
const SALT = "proc1763|";
const TEACHER = "45d3d892";   // hash of the teacher code; set TEACHER_CODE in the build script
const FREEZE_SECONDS = 60;
const KEY = 'proclamation-escape-v1';

function fnv(s){let h=0x811c9dc5;for(const b of new TextEncoder().encode(s)){h^=b;h=Math.imul(h,0x01000193)>>>0;}return h.toString(16).padStart(8,'0');}
function norm(s,sort){s=s.toUpperCase().replace(/[^A-Z0-9]/g,'');return sort?s.split('').sort().join(''):s;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fresh(){return {group:'',started:0,lock:0,revealed:false,hints:[0,0,0,0,0],wrong:0,frozenUntil:0,finished:0};}
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const app=document.getElementById('app');
let teacherOpen=false, teacherOk=false, flash='';

function seals(){return '<div class="seals" aria-label="Locks">'+LOCKS.map((L,i)=>{
  const cls=i<S.lock||(i===S.lock&&S.revealed)||S.finished?'open':i===S.lock?'now':'';
  return `<span class="seal ${cls}" title="Lock ${L.n}">${L.n}</span>`;}).join('')+'</div>';}

function mmss(ms){const t=Math.max(0,Math.round(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}

function render(){
  if(location.hash==='#board'){return renderBoard();}
  document.body.classList.remove('board');
  let h='';
  h+=`<header><div><div class="kicker">${S.group?esc(S.group):'Unit 2'}</div><h1>The Proclamation Line</h1></div>${seals()}</header>`;
  if(!S.started){
    h+=`<section class="card">${MISSION.map(p=>`<p>${p}</p>`).join('')}<ol>${RULES.map(r=>`<li>${r}</li>`).join('')}</ol>
      <div><label for="group">Your group (table number or names)</label><input class="plain" type="text" id="group" placeholder="Table 3" autocomplete="off"></div>
      <div class="row"><button class="primary" id="start">Start Lock 1</button></div></section>`;
  } else if(S.finished){
    const L=LOCKS[LOCKS.length-1];
    h+=`<section class="card lock"><h2>You escaped</h2><div class="reveal"><p>${esc(L.reveal)}</p></div>
      <div class="stats"><div class="stat"><b>${mmss(S.finished-S.started)}</b>time</div><div class="stat"><b>${S.hints.reduce((a,b)=>a+b,0)}</b>hints used</div><div class="stat"><b>${S.wrong}</b>wrong codes</div></div>
      <p>Show this screen to Mr. B, then work on the last question on your group sheet.</p></section>`;
  } else {
    const L=LOCKS[S.lock];
    const frozen=S.frozenUntil>Date.now();
    h+=`<section class="card lock"><div class="kicker">Lock ${L.n} of ${LOCKS.length} · Envelope ${L.n}</div><h2>${esc(L.title)}</h2><p>${esc(L.ask)}</p>`;
    if(S.revealed){
      const next=S.lock+1<LOCKS.length;
      h+=`<div class="reveal"><div class="env">Unlocked</div><p>${esc(L.reveal)}</p>${next?`<p><b>Open Envelope ${L.n+1}.</b></p>`:''}</div>
        <div class="row"><button class="primary" id="next">${next?`Go to Lock ${L.n+1}`:'Finish'}</button></div>`;
    } else {
      h+=`<form id="f" class="fields">${L.fields.map((f,i)=>`<div><label for="c${i}">${esc(f)}</label><input type="text" id="c${i}" autocomplete="off" spellcheck="false" ${frozen?'disabled':''}></div>`).join('')}</form>
        <div class="row"><button class="primary" id="try" ${frozen?'disabled':''}>Unlock</button>
        <button class="ghost" id="hint" ${S.hints[S.lock]>=2?'disabled':''}>${S.hints[S.lock]>=2?'No more hints':`Show hint ${S.hints[S.lock]+1} of 2`}</button></div>`;
      if(frozen) h+=`<div class="msg bad" id="freeze">Not yet. The lock is frozen for <span id="left">${mmss(S.frozenUntil-Date.now())}</span>. Check your work on the group sheet while you wait.</div>`;
      else if(flash) h+=`<div class="msg bad">${flash}</div>`;
      for(let i=0;i<S.hints[S.lock];i++) h+=`<div class="hint"><b>Hint ${i+1}.</b> ${esc(L.hints[i])}</div>`;
    }
    h+='</section>';
  }
  h+=`<footer><button class="link" id="tlink">Teacher</button></footer>`;
  if(teacherOpen){
    h+=`<section class="card teacher">`+(teacherOk?
      `<p><b>Teacher tools.</b> Skip moves this group past the current lock. Reset clears this Chromebook for the next period.</p>
       <div class="row"><button class="ghost" id="skip" ${!S.started||S.finished?'disabled':''}>Skip lock</button><button class="ghost" id="reset">Reset for next group</button><button class="ghost" id="tclose">Close</button></div>`
      :`<div><label for="tcode">Teacher code</label><input class="plain" type="password" id="tcode" autocomplete="off"></div><div class="row"><button class="ghost" id="tgo">Open teacher tools</button></div>`)+`</section>`;
  }
  app.innerHTML=h;
  bind();
}

function bind(){
  const $=id=>document.getElementById(id);
  $('start')&&($('start').onclick=()=>{S.group=($('group').value||'').trim().slice(0,40);S.started=Date.now();save();render();});
  $('group')&&$('group').addEventListener('keydown',e=>{if(e.key==='Enter')$('start').click();});
  const f=$('f');
  if(f){f.addEventListener('submit',e=>{e.preventDefault();check();});
    f.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}}));
    const first=f.querySelector('input:not([disabled])'); if(first) first.focus();}
  $('try')&&($('try').onclick=check);
  $('hint')&&($('hint').onclick=()=>{if(S.hints[S.lock]<2){S.hints[S.lock]++;save();render();}});
  $('next')&&($('next').onclick=()=>{if(S.lock+1<LOCKS.length){S.lock++;S.revealed=false;}else{S.finished=Date.now();}flash='';save();render();});
  $('tlink').onclick=()=>{teacherOpen=!teacherOpen;teacherOk=false;render();};
  $('tgo')&&($('tgo').onclick=()=>{if(fnv(SALT+'teacher|'+$('tcode').value.trim().toLowerCase())===TEACHER){teacherOk=true;}else{$('tcode').value='';$('tcode').placeholder='That code isn’t right';}render();});
  $('tcode')&&$('tcode').addEventListener('keydown',e=>{if(e.key==='Enter')$('tgo').click();});
  $('skip')&&($('skip').onclick=()=>{S.revealed=true;S.frozenUntil=0;teacherOpen=false;save();render();});
  $('reset')&&($('reset').onclick=()=>{S=fresh();save();teacherOpen=false;flash='';render();});
  $('tclose')&&($('tclose').onclick=()=>{teacherOpen=false;render();});
}

function check(){
  const L=LOCKS[S.lock];
  if(S.frozenUntil>Date.now()) return;
  const vals=L.fields.map((_,i)=>document.getElementById('c'+i).value);
  if(vals.some(v=>!norm(v,false))){flash='Fill in every box first.';render();return;}
  const ok=L.h.every((h,i)=>fnv(SALT+L.n+'|'+norm(vals[i],L.sort))===h);
  if(ok){S.revealed=true;flash='';}
  else{S.wrong++;S.frozenUntil=Date.now()+FREEZE_SECONDS*1000;flash='';}
  save();render();
}

setInterval(()=>{
  if(location.hash==='#board'){tickBoard();return;}
  const el=document.getElementById('left');
  if(el){if(S.frozenUntil<=Date.now())render();else el.textContent=mmss(S.frozenUntil-Date.now());}
},500);

/* ---------- board view (projector) ---------- */
let T={total:28*60*1000,left:28*60*1000,runningSince:0};
function tLeft(){return T.runningSince?T.left-(Date.now()-T.runningSince):T.left;}
function renderBoard(){
  document.body.classList.add('board');
  app.innerHTML=`<header><div><div class="kicker">Unit 2 · Proclamation of 1763</div><h1>The Proclamation Line</h1></div>${''}</header>
  <div class="board-grid"><section class="card">${MISSION.map(p=>`<p>${p}</p>`).join('')}<ol>${RULES.map(r=>`<li>${r}</li>`).join('')}</ol></section>
  <section class="card"><div class="timer" id="clock">${mmss(tLeft())}</div>
   <div class="row" style="justify-content:center"><button class="primary" id="go">${T.runningSince?'Pause':'Start'}</button><button class="ghost" id="rs">Reset</button></div>
   <div class="row" style="justify-content:center"><label for="mins" style="margin:0">Minutes</label><input type="number" id="mins" min="1" max="60" value="${Math.round(T.total/60000)}" style="width:110px;font-size:20px;letter-spacing:0"></div></section></div>
  <footer><a class="link" href="#">Back to the lock page</a></footer>`;
  const $=id=>document.getElementById(id);
  $('go').onclick=()=>{if(T.runningSince){T.left=tLeft();T.runningSince=0;}else{T.runningSince=Date.now();try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}}renderBoard();};
  $('rs').onclick=()=>{T.runningSince=0;T.left=T.total;renderBoard();};
  $('mins').onchange=e=>{const m=Math.min(60,Math.max(1,parseInt(e.target.value)||28));T.total=m*60000;T.runningSince=0;T.left=T.total;renderBoard();};
}
function tickBoard(){const c=document.getElementById('clock');if(!c)return;const l=tLeft();if(l<=0&&T.runningSince){T.left=0;T.runningSince=0;}c.textContent=l<=0?'Time!':mmss(l);c.classList.toggle('low',l<5*60000);}
window.addEventListener('hashchange',render);
render();
</script>

</html>
